name: Update Tech Trends Argentina (IA + Senior Stack)

on:
  schedule:
    - cron: '0 3 * * 0'  # Cada domingo 3 AM UTC (sábado noche Argentina)
  workflow_dispatch:  # Permite ejecución manual

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytrends pandas

      - name: Run update script
        run: python update_trends.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add TRENDS.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update tech trends Argentina (IA + stack senior) $(date +'%Y-%m-%d')" && git push)